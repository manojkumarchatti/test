version: '3.8'
services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - STORAGE_PATH=/app/data
      - VECTOR_STORE_PATH=/app/data/vector_store
      - UPLOADS_PATH=/app/data/uploads
    volumes:
      - ./backend/data:/app/data
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - api
    environment:
      - VITE_API_BASE=http://localhost:8000/api
